name: Validar Windows alpha
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.10'
      - run: python -m pip install -r requirements-lock.txt
      - run: choco install libreoffice-fresh --no-progress --yes
      - name: Validar testes e pacote extraído
        env:
          LIBREOFFICE: C:\Program Files\LibreOffice\program\soffice.com
        run: ./.github/scripts/validate.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: LynowCut-Windows-alpha
          path: release-output/
          if-no-files-found: error
