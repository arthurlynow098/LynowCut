name: Publicar release do LynowCut

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Tag existente para publicar (ex. v0.1.1-alpha)
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Validar tag e identificar pré-lançamento
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+(-(alpha|beta|rc)([.-]\d+)?)?$') { throw 'Tag inválida' }
          git show-ref --verify "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'A publicação exige uma tag existente' }
          "tag=$env:RELEASE_TAG" >> $env:GITHUB_OUTPUT
          "prerelease=$($env:RELEASE_TAG.Contains('-').ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.10'
      - name: Instalar dependências
        run: python -m pip install -r requirements-lock.txt
      - run: choco install libreoffice-fresh --no-progress --yes
      - name: Validar testes e pacote extraído
        env:
          LIBREOFFICE: C:\Program Files\LibreOffice\program\soffice.com
        run: ./.github/scripts/validate.ps1
      - name: Criar release no GitHub
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          fail_on_unmatched_files: true
          body_path: release-output/RELEASE-NOTES.md
          files: |
            release-output/LynowCut-Windows-x64.zip
            release-output/SHA256SUMS.txt
